name: Background analysis MySQL and migration verifier
on:
  push:
    branches: [ci/account-book-analysis-jobs-20261110-mysql]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: analysis-root-only
          MYSQL_DATABASE: analysis_jobs_test
          MYSQL_USER: analysis_test
          MYSQL_PASSWORD: analysis-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      ANALYSIS_JOB_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Select the exact product candidate
        run: |
          test "$(git rev-parse HEAD^)" = "de867048bb3d547b787c010e12c079e961e37a37"
          cp .github/verification/JobsReleaseDb.java "$RUNNER_TEMP/JobsReleaseDb.java"
          test "$(sha256sum "$RUNNER_TEMP/JobsReleaseDb.java" | cut -d' ' -f1)" = "729fd5371b5c30301fed021a58cd313187a5141a6b4fcd204c21ac985a84c495"
          git checkout --detach de867048bb3d547b787c010e12c079e961e37a37
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Full BE regression with MySQL integration enabled
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          matches = list(Path("build/test-results/test").glob("*SpendingAnalysisJobMysqlTest.xml"))
          assert len(matches) == 1
          suite = ElementTree.parse(matches[0]).getroot()
          assert all(suite.attrib.get(k) == "0" for k in ("errors", "failures", "skipped"))
          assert suite.attrib["tests"] == "1"
          PY
      - name: Compile and exercise the migration schema verifier
        run: |
          mkdir -p build/verification/classes build/verification/evidence
          javac --release 21 -encoding UTF-8 -d build/verification/classes "$RUNNER_TEMP/JobsReleaseDb.java"
          jar --create --file build/verification/evidence/JobsReleaseDb.jar -C build/verification/classes JobsReleaseDb.class
          cp "$RUNNER_TEMP/JobsReleaseDb.java" build/verification/evidence/
          cp build/test-results/test/*SpendingAnalysisJobMysqlTest.xml build/verification/evidence/
          cat > "$RUNNER_TEMP/JobsShapeSmoke.java" <<'JAVA'
          import java.sql.DriverManager;
          public class JobsShapeSmoke {
              public static void main(String[] args) throws Exception {
                  String url = "jdbc:mysql://127.0.0.1:" + System.getenv("ANALYSIS_JOB_TEST_MYSQL_PORT")
                      + "/analysis_jobs_test?allowPublicKeyRetrieval=true&sslMode=DISABLED";
                  try (var connection = DriverManager.getConnection(url, "analysis_test", "analysis-test-only")) {
                      JobsReleaseDb.compatible(connection);
                  }
              }
          }
          JAVA
          driver="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.mysql/mysql-connector-j" -name 'mysql-connector-j-9.4.0.jar' -type f -print -quit)"
          test -n "$driver"
          java -cp "build/verification/classes:$driver" "$RUNNER_TEMP/JobsShapeSmoke.java"
          (cd build/verification/evidence && sha256sum JobsReleaseDb.jar JobsReleaseDb.java > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-migration-verifier
          path: build/verification/evidence/
