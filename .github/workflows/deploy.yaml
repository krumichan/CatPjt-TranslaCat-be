name: BE Deploy to OCI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # main push와 수동 실행 모두 선택된 SHA를 먼저 검증한다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify environment encoding with synthetic inputs
        run: python -B scripts/check_release_env_encoding.py
      - name: Verify public account deletion flag merging with synthetic inputs
        run: python -B scripts/check_account_deletion_env_overrides.py
      - name: Verify the exact release source
        run: |
          bash -n scripts/deploy-release.sh
          python scripts/check_deploy_release.py
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

  release:
    needs: verify
    # main의 검증 성공 SHA만 같은 workflow run에서 운영에 반영한다.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: translacat-be-production
      cancel-in-progress: false

    runs-on: ubuntu-latest
    timeout-minutes: 125

    steps:
      - name: Encode the environment as data
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          MOBILE_AUTH_APPROVAL_SECRET: ${{ secrets.MOBILE_AUTH_APPROVAL_SECRET }}
          AUTH_MOBILE_ALLOWED_REDIRECT_URIS: ${{ secrets.AUTH_MOBILE_ALLOWED_REDIRECT_URIS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          PUSH_INSTALLATIONS_ENABLED: ${{ vars.PUSH_INSTALLATIONS_ENABLED }}
          PUSH_INSTALLATIONS_MAXIMUMACTIVEPERUSER: ${{ vars.PUSH_INSTALLATIONS_MAXIMUMACTIVEPERUSER }}
          PUSH_INSTALLATIONS_ALLOWEDPROJECTS_DEVELOPMENT_0: ${{ vars.PUSH_INSTALLATIONS_ALLOWEDPROJECTS_DEVELOPMENT_0 }}
        shell: python
        run: |
          import base64
          import ipaddress
          import os
          from pathlib import Path
          import re
          import unicodedata
          from urllib.parse import urlsplit


          def reject(code):
              raise SystemExit('Environment encoding rejected: ' + code)


          def canonical_https_origin(raw: str) -> bool:
              # 패턴·인증·경로를 받지 않는다. 브라우저가 보내는 소문자 host와 정규 port/IP 표기만 허용한다.
              if not raw or not raw.isascii() or any(ord(char) <= 32 or ord(char) >= 127 for char in raw):
                  return False
              if '*' in raw or '%' in raw:
                  return False
              try:
                  parsed = urlsplit(raw)
                  host, port = parsed.hostname, parsed.port
                  if parsed.scheme != 'https' or not host or parsed.username is not None or parsed.password is not None:
                      return False
                  if parsed.path or parsed.query or parsed.fragment or port == 443 or port == 0:
                      return False

                  try:
                      address = ipaddress.ip_address(host)
                      canonical_host = '[' + str(address) + ']' if address.version == 6 else str(address)
                  except ValueError:
                      labels = host.split('.')
                      if len(host) > 253 or len(labels) < 2 or labels[-1].isdigit() or re.fullmatch(r'0x[0-9a-f]+', labels[-1]):
                          return False
                      if any(re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?', label) is None for label in labels):
                          return False
                      canonical_host = host

                  expected = 'https://' + canonical_host + (':' + str(port) if port is not None else '')
                  return raw == expected
              except ValueError:
                  return False


          def valid_cors_allowed_origins(raw: str, frontend: str) -> bool:
              # 선택 override도 기존 FE origin을 포함해야 한다. 정확한 두 origin까지 허용하며 wildcard로 넓히지 않는다.
              origins = raw.split(',')
              return (1 <= len(origins) <= 2 and len(set(origins)) == len(origins)
                      and frontend in origins and all(canonical_https_origin(origin) for origin in origins))


          def push_settings_error(values: dict[str, str]) -> str | None:
              # 공개 푸시 설정은 완전체 또는 명시 OFF만 받는다. 값을 trim하거나 다른 환경을 추정하지 않는다.
              enabled = 'PUSH_INSTALLATIONS_ENABLED'
              maximum = 'PUSH_INSTALLATIONS_MAXIMUMACTIVEPERUSER'
              project = 'PUSH_INSTALLATIONS_ALLOWEDPROJECTS_DEVELOPMENT_0'
              names = (enabled, maximum, project)
              present = set(names).intersection(values)
              if not present:
                  return None
              if enabled not in present:
                  return 'PUSH_PARTIAL_CONFIGURATION'
              if values[enabled] not in ('true', 'false'):
                  return 'PUSH_INVALID_ENABLED'
              if values[enabled] == 'false' and present == {enabled}:
                  return None
              if present != set(names):
                  return 'PUSH_PARTIAL_CONFIGURATION'
              if re.fullmatch(r'[1-9]|10', values[maximum]) is None:
                  return 'PUSH_INVALID_MAXIMUM'
              if re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', values[project]) is None:
                  return 'PUSH_INVALID_PROJECT'
              return None


          # 빈 별도 Secret은 기존 blob의 값을 지우지 않는다. 원문 값을 trim/decode하지 않는다.
          names = ('MOBILE_AUTH_APPROVAL_SECRET', 'AUTH_MOBILE_ALLOWED_REDIRECT_URIS', 'CORS_ALLOWED_ORIGINS')
          overrides = {name: os.environ.get(name, '') for name in names}
          for name, value in overrides.items():
              # CORS는 원본의 FE origin을 읽은 뒤 별도 계약으로 검사한다.
              if name == 'CORS_ALLOWED_ORIGINS':
                  continue
              if value == '':
                  continue
              if any(char.isspace() or unicodedata.category(char).startswith('C') for char in value):
                  reject('INVALID_MOBILE_OVERRIDE')
              if name == 'MOBILE_AUTH_APPROVAL_SECRET' and len(value.encode('utf-8')) < 32:
                  reject('APPROVAL_SECRET_TOO_SHORT')
              if name == 'AUTH_MOBILE_ALLOWED_REDIRECT_URIS' and (
                      not value.isascii() or value != 'translacat-dev://auth/callback'):
                  reject('INVALID_DEVELOPMENT_CALLBACK')

          # 기존 Docker env-file 문법을 유지한다. CRLF/BOM을 몰래 정규화하거나 중복을 덮어쓰지 않는다.
          original = os.environ.get('ENV_FILE_CONTENT', '')
          if not original.strip():
              reject('ENV_FILE_CONTENT_EMPTY')
          if original.startswith('\ufeff') or '\r' in original or '\0' in original:
              reject('INVALID_ENV_FILE_ENCODING')
          try:
              original.encode('utf-8')
          except UnicodeError:
              reject('INVALID_ENV_FILE_ENCODING')

          lines = original.split('\n')
          positions = {}
          for index, line in enumerate(lines):
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              key, separator, value = line.partition('=')
              if not separator or re.fullmatch(r'[A-Z][A-Z0-9_]*', key) is None:
                  reject('INVALID_ENV_FILE_RECORD')
              if key in positions:
                  reject('DUPLICATE_ENV_FILE_KEY')
              positions[key] = index

          # 별도 CORS 입력은 원본 FE origin을 포함하는 정규 HTTPS 주소만 허용한다.
          cors_override = overrides['CORS_ALLOWED_ORIGINS']
          frontend = ''
          if 'FRONTEND_URL' in positions:
              frontend = lines[positions['FRONTEND_URL']].partition('=')[2]
          if cors_override and not valid_cors_allowed_origins(cors_override, frontend):
              reject('INVALID_CORS_OVERRIDE')

          # 공개 Actions Variables는 빈 값이면 원본을 유지하고, 명시 OFF 외 충돌은 거부한다.
          push_names = ('PUSH_INSTALLATIONS_ENABLED', 'PUSH_INSTALLATIONS_MAXIMUMACTIVEPERUSER',
                        'PUSH_INSTALLATIONS_ALLOWEDPROJECTS_DEVELOPMENT_0')
          existing_push = {name: lines[positions[name]].partition('=')[2] for name in push_names if name in positions}
          push_error = push_settings_error(existing_push)
          if push_error:
              reject(push_error)
          push_overrides = {name: os.environ.get(name, '') for name in push_names if os.environ.get(name, '') != ''}
          push_error = push_settings_error(push_overrides)
          if push_error:
              reject(push_error)
          for name, value in push_overrides.items():
              if name in existing_push and existing_push[name] != value:
                  explicit_off = name == 'PUSH_INSTALLATIONS_ENABLED' and value == 'false' and existing_push[name] == 'true'
                  if not explicit_off:
                      reject('PUSH_OVERRIDE_CONFLICT')
          overrides.update(push_overrides)

          # 승인/CORS/공개 푸시의 정확한 이름만 치환·추가한다. 다른 행과 마지막 LF는 그대로 유지한다.
          for name, value in overrides.items():
              if value == '':
                  continue
              record = name + '=' + value
              if name in positions:
                  lines[positions[name]] = record
              elif lines[-1] == '':
                  lines.insert(len(lines) - 1, record)
              else:
                  lines.append(record)

          merged = '\n'.join(lines)
          encoded = base64.b64encode(merged.encode('utf-8')).decode('ascii')
          output_path = os.environ.get('GITHUB_ENV', '')
          if not output_path:
              reject('GITHUB_ENV_MISSING')

          # raw Secret은 GitHub가 마스킹한다. 파생 Base64도 등록한 뒤 한 번만 env 파일에 전달한다.
          try:
              with Path(output_path).open('a', encoding='utf-8', newline='\n') as output:
                  print('::add-mask::' + encoded, flush=True)
                  output.write('DEPLOY_ENV_B64=' + encoded + '\n')
          except OSError:
              reject('GITHUB_ENV_WRITE_FAILED')

      - name: Merge public account deletion flags
        env:
          ACCOUNT_DELETION_ENABLED: ${{ vars.ACCOUNT_DELETION_ENABLED }}
          ACCOUNT_DELETION_WORKER_ENABLED: ${{ vars.ACCOUNT_DELETION_WORKER_ENABLED }}
        shell: python
        run: |
          import base64
          import binascii
          import os
          from pathlib import Path
          import re


          def reject(code):
              raise SystemExit('Account deletion environment merge rejected: ' + code)


          def merge_public_flags(original, variables):
              # 기존 encoder의 env-file 문법을 유지하고 중복 행을 조용히 덮어쓰지 않는다.
              if not original.strip():
                  reject('ENV_FILE_CONTENT_EMPTY')
              if original.startswith('\ufeff') or '\r' in original or '\0' in original:
                  reject('INVALID_ENV_FILE_ENCODING')
              lines = original.split('\n')
              positions = {}
              for index, line in enumerate(lines):
                  if not line.strip() or line.lstrip().startswith('#'):
                      continue
                  name, separator, value = line.partition('=')
                  if not separator or re.fullmatch(r'[A-Z][A-Z0-9_]*', name) is None:
                      reject('INVALID_ENV_FILE_RECORD')
                  if name in positions:
                      reject('DUPLICATE_ENV_FILE_KEY')
                  positions[name] = index

              # 두 공개 flag는 독립적이다. 빈 Variable은 기존 유효 값을 보존하고 최초만 false다.
              selected = {}
              for name in ('ACCOUNT_DELETION_ENABLED', 'ACCOUNT_DELETION_WORKER_ENABLED'):
                  existing = lines[positions[name]].partition('=')[2] if name in positions else None
                  override = variables.get(name, '')
                  if existing is not None and existing not in ('true', 'false'):
                      reject('INVALID_EXISTING_FLAG')
                  if override != '' and override not in ('true', 'false'):
                      reject('INVALID_PUBLIC_FLAG')
                  selected[name] = override if override != '' else existing if existing is not None else 'false'

              # 정확한 두 키만 한 번씩 치환·추가하며 다른 Secret/설정과 마지막 LF는 보존한다.
              for name, value in selected.items():
                  record = name + '=' + value
                  if name in positions:
                      lines[positions[name]] = record
                  elif lines[-1] == '':
                      lines.insert(len(lines) - 1, record)
                  else:
                      lines.append(record)
              return '\n'.join(lines)


          # 앞 step의 마스킹된 Base64만 읽는다. 원문이나 오류 입력은 출력하지 않는다.
          try:
              original = base64.b64decode(os.environ.get('DEPLOY_ENV_B64', ''), validate=True).decode('utf-8')
          except (binascii.Error, UnicodeError, ValueError):
              reject('INVALID_DEPLOY_ENV_ENCODING')
          merged = merge_public_flags(original, os.environ)
          encoded = base64.b64encode(merged.encode('utf-8')).decode('ascii')
          output_path = os.environ.get('GITHUB_ENV', '')
          if not output_path:
              reject('GITHUB_ENV_MISSING')

          # 파생 Base64도 별도로 마스킹한 뒤 다음 SSH step에 최종 값을 전달한다.
          try:
              with Path(output_path).open('a', encoding='utf-8', newline='\n') as output:
                  print('::add-mask::' + encoded, flush=True)
                  output.write('DEPLOY_ENV_B64=' + encoded + '\n')
          except OSError:
              reject('GITHUB_ENV_WRITE_FAILED')

      - name: Prepare strict BE SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          key="$RUNNER_TEMP/translacat-be-deploy-key"
          candidate="$RUNNER_TEMP/translacat-be-known-hosts.candidate"
          known="$RUNNER_TEMP/translacat-be-known-hosts"

          # GitHub Secret의 user-auth private key를 runner 임시 파일에만 둔다.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"

          # 사용자가 독립적으로 검증한 BE ED25519 host fingerprint.
          expected='SHA256:iHsMnLENMuXeRoIEBlZAEAUu2W0bnlEU5+oEm975cc4'

          # ssh-keyscan 결과 자체를 신뢰하지 않고 위 고정 fingerprint와 대조한다.
          ssh-keyscan -T 10 -t ed25519 "$OCI_HOST" 2>/dev/null > "$candidate"
          test -s "$candidate"

          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 { print $2 }')"

          if [[ "$actual" != "$expected" ]]; then
            echo "BE SSH ED25519 host fingerprint mismatch" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi

          mv "$candidate" "$known"
          chmod 600 "$known"

          {
            echo "BE_SSH_KEY=$key"
            echo "BE_KNOWN_HOSTS=$known"
          } >> "$GITHUB_ENV"

          echo "BE SSH ED25519 host fingerprint verified."

      - name: Release selected main SHA via native OpenSSH
        timeout-minutes: 115
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          ssh \
            -i "$BE_SSH_KEY" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$BE_KNOWN_HOSTS" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$OCI_USERNAME@$OCI_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' DEPLOY_ENV_B64='$DEPLOY_ENV_B64' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$HOME/CatPjt-TranslaCat-be"

          # checkout부터 rollback까지 같은 잠금을 상속한다.
          mkdir -p "$HOME/.translacat-deploy"
          exec 9> "$HOME/.translacat-deploy/be.lock"
          flock --nonblock 9 || {
            echo 'Another BE deployment holds the lock' >&2
            exit 2
          }
          export DEPLOY_LOCK_FD=9

          # 기존 .env와 운영 사전만 정확한 untracked 예외로 인정한다.
          git diff --quiet
          git diff --cached --quiet

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'Tracked production environment blocks the deployment' >&2
            exit 2
          fi

          untracked_file="$(mktemp /tmp/translacat-be-worktree.XXXXXX)"
          trap 'rm -f "$untracked_file"' EXIT

          git ls-files --others --exclude-standard -z > "$untracked_file"

          while IFS= read -r -d '' path; do
            case "$path" in
              .env|sudachi/system_full.dic)
                [[ -f "$path" && ! -L "$path" ]] || {
                  echo 'Untracked runtime input must be a regular file' >&2
                  exit 2
                }
                ;;
              *)
                echo 'Unreviewed untracked files block the deployment' >&2
                exit 2
                ;;
            esac
          done < "$untracked_file"

          rm -f "$untracked_file"
          trap - EXIT

          # 현재 workflow가 검증한 정확한 main SHA만 배포한다.
          GIT_LFS_SKIP_SMUDGE=1 git fetch --no-tags origin "$RELEASE_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$RELEASE_SHA"

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          bash scripts/deploy-release.sh "$RELEASE_SHA"
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f \
            "${BE_SSH_KEY:-}" \
            "${BE_KNOWN_HOSTS:-}" \
            "$RUNNER_TEMP/translacat-be-known-hosts.candidate"
