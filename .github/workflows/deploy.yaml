name: BE Deploy to OCI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# 진행 중인 stop/rollback을 새 push가 취소하지 않도록 전체 release를 직렬화한다.
concurrency:
  group: translacat-be-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact release source
        run: |
          bash -n scripts/deploy-release.sh
          python scripts/check_deploy_release.py
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

  release:
    needs: verify
    # 내장 소설의 수동 SQL 백업·적용 확인 전에는 main push만으로 운영 앱을 바꾸지 않는다.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 서버 build 90분과 readiness/rollback, SSH 전송에 별도 여유를 둔다.
    timeout-minutes: 125
    steps:
      - name: Encode the environment as data
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path
          value = os.environ['ENV_FILE_CONTENT']
          if not value.strip():
              raise SystemExit('ENV_FILE_CONTENT is empty')
          encoded = base64.b64encode(value.encode('utf-8')).decode('ascii')
          print('::add-mask::' + encoded)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write('DEPLOY_ENV_B64=' + encoded + '\n')
      - name: Release the verified SHA via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 기존 strict known_hosts 접속으로 대조한 BE 서버 ED25519 host key이다.
          fingerprint: SHA256:iHsMnLENMuXeRoIEBlZAEAUu2W0bnlEU5+oEm975cc4
          debug: false
          envs: RELEASE_SHA,DEPLOY_ENV_B64
          command_timeout: 115m
          script: |
            set -Eeuo pipefail
            umask 077
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            cd "$HOME/CatPjt-TranslaCat-be"

            # checkout부터 rollback까지 같은 잠금을 상속한다. 잠금은 repo 밖에 둔다.
            mkdir -p "$HOME/.translacat-deploy"
            exec 9> "$HOME/.translacat-deploy/be.lock"
            flock --nonblock 9 || { echo 'Another BE deployment holds the lock' >&2; exit 2; }
            export DEPLOY_LOCK_FD=9

            # 첫 배포의 기존 .env와 운영 사전만 정확한 untracked 예외로 인정한다.
            # 기존 .env를 읽거나 이동하지 않으며 symlink/추적된 비밀 파일은 거부한다.
            git diff --quiet
            git diff --cached --quiet
            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              echo 'Tracked production environment blocks the deployment' >&2
              exit 2
            fi
            untracked_file="$(mktemp /tmp/translacat-be-worktree.XXXXXX)"
            trap 'rm -f "$untracked_file"' EXIT
            git ls-files --others --exclude-standard -z > "$untracked_file"
            while IFS= read -r -d '' path; do
              case "$path" in
                .env|sudachi/system_full.dic)
                  [[ -f "$path" && ! -L "$path" ]] || { echo 'Untracked runtime input must be a regular file' >&2; exit 2; }
                  ;;
                *) echo 'Unreviewed untracked files block the deployment' >&2; exit 2 ;;
              esac
            done < "$untracked_file"
            rm -f "$untracked_file"
            trap - EXIT

            # main의 최신 tip이 아닌 verify가 성공한 commit 하나만 선택한다.
            GIT_LFS_SKIP_SMUDGE=1 git fetch --no-tags origin "$RELEASE_SHA"
            GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            bash scripts/deploy-release.sh "$RELEASE_SHA"
