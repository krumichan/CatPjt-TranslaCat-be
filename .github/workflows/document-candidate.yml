name: Document BE candidate verification
on:
  push:
    branches: [ci/document-first-introduction-be-20261123]
permissions:
  contents: read
jobs:
  verify:
    # main push와 수동 실행 모두 선택된 SHA를 먼저 검증한다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify environment encoding with synthetic inputs
        run: python -B scripts/check_release_env_encoding.py
      - name: Verify public account deletion flag merging with synthetic inputs
        run: python -B scripts/check_account_deletion_env_overrides.py
      - name: Verify document format regression first
        run: |
          chmod +x gradlew
          ./gradlew test --tests 'jp.co.translacat.domain.documenttranslation.format.*' --no-daemon
      - name: Verify the exact release source
        run: |
          bash -n scripts/deploy-release.sh
          python scripts/check_deploy_release.py
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-be-test-results
          path: build/test-results/
