name: Existing operating configuration read only

on:
  push:
    branches: [ci/operating-config-preflight-20261126]

permissions:
  contents: read

jobs:
  inspect-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect only the existing secret boundary and bucket domain state
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: python3 -B .codex-ci/operating-config-preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: configuration-readiness
          path: configuration-readiness.json
          if-no-files-found: error
