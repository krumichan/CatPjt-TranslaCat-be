# MySQL configuration
spring.datasource.url=${DB_URL}?rewriteBatchedStatements=true&sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 기동 중 유휴 DB 연결이 닫혀 사전 초기화가 실패하는 상황을 줄인다.
spring.datasource.hikari.keepalive-time=30000
# 운영 기동은 스키마를 변경하지 않는다. 불일치는 배포를 중단하고 별도 검토한다.
spring.jpa.hibernate.ddl-auto=validate
# google info
# https://console.cloud.google.com/auth/clients/15694267434-61diaq8m1iuj3n8vo6bqn09vvk3rikfl.apps.googleusercontent.com?hl=ko&project=gen-lang-client-0347263829
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# cors
cors.allowed-origin=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
# google AI (gemini)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# google proxy
# https://script.google.com/home/?hl=ko&pli=1
external.google.proxy-url=${GOOGLE_PROXY_URL}
external.use-proxy=false
# result set table.
logging.level.jdbc.resultsettable=WARN
# furigana
sudachi.dictionary.path=/app/dictionaries/system_full.dic
# python AI Server
ai-server.url=${AI_SERVER_URL}
ai-server.api-key=${AI_SERVER_API_KEY}
# jwt
# 1000*60*60*24 (1 day)
jwt.token.expired.access=86400000
# 1000*60*60*24*7 (7 days)
jwt.token.expired.refresh=604800000
jwt.token.secret-key=${JWT_SECRET_KEY}

# Cloudflare R2
translacat.storage.type=s3
translacat.storage.s3.bucket=${CLOUDFLARE_R2_BUCKET}
translacat.storage.s3.access-key=${CLOUDFLARE_R2_ACCESS_KEY_ID}
translacat.storage.s3.secret-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
translacat.storage.s3.endpoint=${CLOUDFLARE_R2_ENDPOINT}
translacat.storage.s3.region=${CLOUDFLARE_R2_REGION}
translacat.storage.s3.public-base-url=${CLOUDFLARE_R2_PUBLIC_BASE_URL}

# Language Learning Internal API
language-learning.url=${LL_INTERNAL_SERVER_URL}
language-learning.internal-jwt.issuer=translacat-be
language-learning.internal-jwt.audience=translacat-ll
language-learning.internal-jwt.caller-service=translacat-be
language-learning.internal-jwt.secret-base64=${LL_INTERNAL_JWT_SECRET_BASE64}
language-learning.internal-jwt.ttl-seconds=120

# Chat Remote Gateway
# BE -> CHAT
chat.gateway.base-url=${CHAT_GATEWAY_BASE_URL:}
chat.gateway.environment=${CHAT_RUNTIME_ENVIRONMENT:}
chat.gateway.issuer=translacat-be
chat.gateway.audience=translacat-chat
chat.gateway.service=translacat-be
chat.gateway.secret-base64=${CHAT_GATEWAY_SECRET_BASE64}
chat.gateway.timeout-seconds=10
chat.gateway.token-lifetime-seconds=60

# Chat Core Identity
# CHAT -> BE
chat.core.identity.environment=${CHAT_RUNTIME_ENVIRONMENT:}
chat.core.identity.issuer=translacat-chat
chat.core.identity.audience=translacat-be
chat.core.identity.service=translacat-chat
chat.core.identity.secret-base64=${CHAT_CORE_IDENTITY_SECRET_BASE64}

# Gmail SMTP: 운영 비밀값은 BE GitHub Secret의 ENV_FILE_CONTENT에서 공급한다.
translacat.auth.mail.enabled=${TRANSLACAT_MAIL_ENABLED:false}
spring.mail.host=${TRANSLACAT_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${TRANSLACAT_MAIL_PORT:587}
spring.mail.username=${TRANSLACAT_MAIL_USERNAME:}
spring.mail.password=${TRANSLACAT_MAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
translacat.auth.email.code-secret=${TRANSLACAT_EMAIL_CODE_SECRET:}
translacat.auth.email.daily-limit=${TRANSLACAT_MAIL_DAILY_LIMIT:400}
